name: Deploy MU-Plugins to Staging

# Staging counterpart of deploy-mu-plugins.yml, used to rehearse and verify
# an MU-plugin on staging before it reaches production.
#
# Scope is deliberately ONE file: sitemap-404-status-fix.php. The
# production workflow syncs all of site/mu-plugins/, which would also push
# brevo-checkout-capture-shim.php onto staging — an unrelated change to a
# server we are only using to verify the sitemap fix. So the file under
# test is copied into a build/ directory first and that directory is what
# gets synced. Nothing else in site/mu-plugins/ can reach staging.
#
# Everything else mirrors production: same FTPS action, same
# STAGING_SFTP_* credential pattern as staging.yml, same chrooted
# /wp-content/ docroot shape (verified 2026-08-16 via
# staging-ftp-diagnose.yml), its own state file so untracked mu-plugins
# already on the staging server are never touched or deleted.
#
# Normal use is workflow_dispatch with the ref set to the branch under test.

on:
  push:
    branches: [staging]
    paths:
      - "site/mu-plugins/sitemap-404-status-fix.php"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage only the sitemap fix
        run: |
          mkdir -p build/mu-plugins
          cp site/mu-plugins/sitemap-404-status-fix.php build/mu-plugins/
          echo "--- files that will be uploaded ---"
          ls -la build/mu-plugins/
          n=$(ls -1 build/mu-plugins/ | wc -l)
          [ "$n" = "1" ] || { echo "::error::expected exactly 1 file to upload, found $n"; exit 1; }

      - name: Upload mu-plugin via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USER }}
          password: ${{ secrets.STAGING_SFTP_PASS }}
          protocol: ftps
          local-dir: build/mu-plugins/
          server-dir: /wp-content/mu-plugins/
          state-name: .molosoc-mu-plugins-state.json

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify what landed on the server
        env:
          HOST: ${{ secrets.STAGING_SFTP_HOST }}
          USER: ${{ secrets.STAGING_SFTP_USER }}
          PASS: ${{ secrets.STAGING_SFTP_PASS }}
        run: |
          # Read-only listing. lftp with `ssl:verify-certificate no` is the
          # proven staging FTPS pattern in this repo — staging-ftp-diagnose.yml,
          # staging-purge-page-cache.yml and staging-set-product-price.yml all
          # use exactly this, and the last of those already lists and writes
          # /wp-content/mu-plugins on this same account. The host's FTPS
          # certificate does not match the staging account hostname, so
          # `curl --ssl-reqd` fails with error 60. Production's certificate
          # does match, which is why deploy-mu-plugins.yml can use curl there.
          lftp -u "$USER,$PASS" \
            -e "set ftp:ssl-force true; set ssl:verify-certificate no; cls -1 /wp-content/mu-plugins; bye" \
            "$HOST" > /tmp/listing.txt 2>&1
          cat /tmp/listing.txt
          grep -q "sitemap-404-status-fix.php" /tmp/listing.txt \
            && echo "sitemap fix present on staging" \
            || { echo "::error::sitemap fix missing from staging listing"; exit 1; }
          if grep -q "brevo-checkout-capture-shim.php" /tmp/listing.txt; then
            echo "::warning::brevo shim already present on staging — not uploaded by this workflow"
          else
            echo "brevo shim absent from staging, as intended"
          fi
          # No superseded sitemap workaround may survive on the server.
          for obsolete in sitemap-polylang-redirect-fix.php sitemap-404-to-start-bypass.php; do
            if grep -q "$obsolete" /tmp/listing.txt; then
              echo "::error::obsolete $obsolete still on staging"
              exit 1
            fi
          done
          echo "no obsolete sitemap workarounds on staging"
