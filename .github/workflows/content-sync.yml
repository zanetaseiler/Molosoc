name: Content Sync to WordPress (draft only)

# Triggers whenever a markdown draft changes in these folders, on the staging
# branch. Only ever pushes status=draft — publishing stays a manual step in
# wp-admin. This mirrors the code-deploy pattern: auto to staging, human gate
# before anything goes live.

on:
  push:
    branches: [staging]
    paths:
      - "seo/pillars/**.md"
      - "seo/spokes/**.md"
      - "seo/cz-pages/**.md"
      - "content/**.md"

jobs:
  push-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit to diff changed files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests markdown python-frontmatter

      - name: Find changed markdown files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD -- 'seo/pillars/*.md' 'seo/spokes/*.md' 'seo/cz-pages/*.md' 'content/*.md' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Push changed drafts to WordPress
        if: steps.changed.outputs.files != ''
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 automations/content-sync/push_to_wp.py ${{ steps.changed.outputs.files }} --status draft
