name: Diagnose Production (read-only)

# Temporary, read-only diagnostic. Does NOT deploy, write, or modify
# anything on the server or in WordPress. Two checks only:
#   1. Dry-run reverse mirror (lftp --dry-run) comparing local site/theme/
#      against the live /wp-content/themes/molosoc/ over SFTP, to report
#      any file differences without transferring anything.
#   2. GET (read-only) the WP REST API for the currently active theme.
# Safe to delete once the mismatch is diagnosed.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare local theme files vs. live server (dry-run, no changes)
        if: false # skipped for this run — auth test only, per request
        env:
          SFTP_HOST: ${{ secrets.PROD_SFTP_HOST }}
          SFTP_USER: ${{ secrets.PROD_SFTP_USER }}
          SFTP_PASS: ${{ secrets.PROD_SFTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          echo "=== Dry-run diff: local site/theme/ vs remote /wp-content/themes/molosoc/ ==="
          lftp -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 20;
            set net:max-retries 2;
            open -u \"$SFTP_USER,$SFTP_PASS\" \"$SFTP_HOST\";
            mirror --dry-run --reverse --verbose site/theme/ /wp-content/themes/molosoc/;
            bye
          "

      - name: WP REST auth test (read-only, /users/me)
        if: false # skipped for this run — end-to-end create test only, per request
        env:
          WP_URL: ${{ secrets.PROD_WP_URL }}
          WP_USER: ${{ secrets.PROD_WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.PROD_WP_APP_PASSWORD }}
        run: |
          echo "=== Authenticated identity per WP REST API (/users/me) ==="
          HTTP_STATUS=$(curl -s -o /tmp/wp_me.json -w "%{http_code}" -u "$WP_USER:$WP_APP_PASSWORD" "${WP_URL%/}/wp-json/wp/v2/users/me?context=edit")
          echo "HTTP status: $HTTP_STATUS"
          echo "--- raw body ---"
          cat /tmp/wp_me.json
          echo ""
          echo "--- pretty (if valid JSON) ---"
          python3 -m json.tool < /tmp/wp_me.json || true

      - name: Create ONE draft test page (minimal end-to-end write test)
        if: always()
        env:
          WP_URL: ${{ secrets.PROD_WP_URL }}
          WP_USER: ${{ secrets.PROD_WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.PROD_WP_APP_PASSWORD }}
        run: |
          echo "=== POST /wp-json/wp/v2/pages (status=draft) ==="
          PAYLOAD='{"title":"REST API Test - Delete Me","status":"draft","content":"Production REST API connection test."}'

          HTTP_STATUS=$(curl -s -o /tmp/wp_page_response.json -w "%{http_code}" \
            -u "$WP_USER:$WP_APP_PASSWORD" \
            -H "Content-Type: application/json" \
            -X POST \
            --data-raw "$PAYLOAD" \
            "${WP_URL%/}/wp-json/wp/v2/pages")

          echo "HTTP status: $HTTP_STATUS"
          echo "--- raw body ---"
          cat /tmp/wp_page_response.json
          echo ""

          if [ "$HTTP_STATUS" = "403" ] && grep -qi "imunify" /tmp/wp_page_response.json; then
            echo "STOPPED: 403 from Imunify360 bot-protection. Not retrying."
            exit 0
          fi

          echo "--- pretty (if valid JSON) ---"
          python3 -m json.tool < /tmp/wp_page_response.json || true
