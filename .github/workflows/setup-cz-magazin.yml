name: Set up CZ Magazín page (prod)

# One-off steps to stand up the Czech Journal ("Magazín", /cz/magazin/),
# run as separate dispatches so the Polylang step can be sandwiched
# between migrate-to-production.yml's deploy-helper / remove-helper
# phases (free Polylang has no REST for language/translation writes):
#
#   create-page  create page slug=magazin, template page-blog.php (idempotent)
#   polylang     set-language cz + link-translations en:881 <-> cz:<magazin>
#                (requires the migration helper mu-plugin to be deployed)
#   menu         point CZ menu item 913 at /cz/magazin/ (label stays "Blog")
#   redirect     add Redirection rule /cz/blog/ -> /cz/magazin/ 301 (idempotent)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - create-page
          - polylang
          - menu
          - redirect

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Run step
        env:
          WP_URL: ${{ secrets.PROD_WP_URL }}
          WP_USER: ${{ secrets.PROD_WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.PROD_WP_APP_PASSWORD }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set -u
          BASE="${WP_URL%/}"
          AUTH="$WP_USER:$WP_APP_PASSWORD"

          # GET with retry until valid JSON (runner-firewall guard)
          fetch() {
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -m 30 -o /tmp/get.json -w "%{http_code}" -u "$AUTH" "$1")
              if [ "$CODE" = "200" ] && python3 -c "import json; json.load(open('/tmp/get.json'))" 2>/dev/null; then
                return 0
              fi
              echo "fetch attempt $i: HTTP $CODE (retrying)"; sleep 15
            done
            return 1
          }

          find_magazin() {
            fetch "$BASE/wp-json/wp/v2/pages?slug=magazin&status=publish,draft&context=edit&_fields=id,slug,status" || return 1
            python3 -c "import json; d=json.load(open('/tmp/get.json')); print(d[0]['id'] if d else '')"
          }

          case "$ACTION" in
            create-page)
              PID=$(find_magazin) || { echo "::error::lookup failed"; exit 1; }
              if [ -n "$PID" ]; then echo "page magazin already exists: ID $PID — nothing created"; exit 0; fi
              CODE=$(curl -s -m 60 -o /tmp/new.json -w "%{http_code}" -u "$AUTH" \
                -X POST -H "Content-Type: application/json" \
                -d '{"title":"Magazín","slug":"magazin","status":"publish","template":"page-blog.php","comment_status":"closed","ping_status":"closed"}' \
                "$BASE/wp-json/wp/v2/pages")
              echo "create: HTTP $CODE"; head -c 800 /tmp/new.json; echo
              [ "$CODE" = "201" ] || { echo "::error::create failed"; exit 1; }
              python3 -c "import json; d=json.load(open('/tmp/new.json')); print('created', d['id'], d['slug'], d['status'], 'template', d['template'], 'link', d['link'])"
              ;;

            polylang)
              PID=$(find_magazin) || { echo "::error::lookup failed"; exit 1; }
              [ -n "$PID" ] || { echo "::error::magazin page not found — run create-page first"; exit 1; }
              echo "magazin page ID: $PID"
              CODE=$(curl -s -m 60 -o /tmp/l.json -w "%{http_code}" -u "$AUTH" \
                -X POST -H "Content-Type: application/json" \
                -d "{\"post_id\":$PID,\"lang\":\"cz\"}" \
                "$BASE/wp-json/molosoc-migrate/v1/set-language")
              echo "set-language: HTTP $CODE"; head -c 500 /tmp/l.json; echo
              [ "$CODE" = "200" ] || { echo "::error::set-language failed (is the helper deployed?)"; exit 1; }
              CODE=$(curl -s -m 60 -o /tmp/t.json -w "%{http_code}" -u "$AUTH" \
                -X POST -H "Content-Type: application/json" \
                -d "{\"translations\":{\"en\":881,\"cz\":$PID}}" \
                "$BASE/wp-json/molosoc-migrate/v1/link-translations")
              echo "link-translations: HTTP $CODE"; head -c 500 /tmp/t.json; echo
              [ "$CODE" = "200" ] || { echo "::error::link-translations failed"; exit 1; }
              ;;

            menu)
              CODE=$(curl -s -m 60 -o /tmp/m.json -w "%{http_code}" -u "$AUTH" \
                -X POST -H "Content-Type: application/json" \
                -d '{"url":"https://molosoc.com/cz/magazin/"}' \
                "$BASE/wp-json/wp/v2/menu-items/913")
              echo "menu update: HTTP $CODE"; head -c 500 /tmp/m.json; echo
              [ "$CODE" = "200" ] || { echo "::error::menu update failed"; exit 1; }
              python3 -c "import json; d=json.load(open('/tmp/m.json')); print('item', d['id'], 'title', d['title']['rendered'], 'url', d['url'])"
              ;;

            redirect)
              fetch "$BASE/wp-json/redirection/v1/redirect?per_page=100" || { echo "::error::could not list redirects"; exit 1; }
              DUP=$(python3 -c "
          import json
          d = json.load(open('/tmp/get.json'))
          print(','.join(str(r['id']) for r in d.get('items', []) if r['url'] == '/cz/blog/'))")
              if [ -n "$DUP" ]; then echo "redirect for /cz/blog/ already exists (id $DUP) — nothing added"; exit 0; fi
              fetch "$BASE/wp-json/redirection/v1/group?per_page=10" || { echo "::error::could not list groups"; exit 1; }
              GID=$(python3 -c "
          import json
          d = json.load(open('/tmp/get.json'))
          items = d.get('items', [])
          print(items[0]['id'] if items else 1)")
              echo "using redirect group $GID"
              CODE=$(curl -s -m 60 -o /tmp/r.json -w "%{http_code}" -u "$AUTH" \
                -X POST -H "Content-Type: application/json" \
                -d "{\"url\":\"/cz/blog/\",\"match_type\":\"url\",\"action_type\":\"url\",\"action_code\":301,\"group_id\":$GID,\"action_data\":{\"url\":\"/cz/magazin/\"}}" \
                "$BASE/wp-json/redirection/v1/redirect")
              echo "create redirect: HTTP $CODE"; head -c 500 /tmp/r.json; echo
              [ "$CODE" = "200" ] || { echo "::error::redirect create failed"; exit 1; }
              ;;
          esac
