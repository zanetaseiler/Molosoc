name: Compare Polylang Staging vs Production (read-only)

# Phase 1.5 pre-check: strictly read-only comparison of Polylang state
# (plugin installed/active/version, pll/v1 REST namespace, configured
# languages, default language, URL settings, menu locations, hreflang
# output) between staging and production. Makes zero writes to either
# environment. Safe to delete once the Polylang gap is resolved.

on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Staging — Polylang state
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ENV_LABEL: STAGING
        run: |
          bash -c "$CHECK_SCRIPT"

      - name: Production — Polylang state
        if: always()
        env:
          WP_URL: ${{ secrets.PROD_WP_URL }}
          WP_USER: ${{ secrets.PROD_WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.PROD_WP_APP_PASSWORD }}
          ENV_LABEL: PRODUCTION
        run: |
          bash -c "$CHECK_SCRIPT"

env:
  CHECK_SCRIPT: |
    set -u
    BASE="${WP_URL%/}"
    AUTH="$WP_USER:$WP_APP_PASSWORD"

    echo "=== [$ENV_LABEL] 1. REST namespaces (looking for pll/v1) ==="
    curl -s "$BASE/wp-json/" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('namespaces',[]), indent=2))"

    echo "=== [$ENV_LABEL] 2. Installed plugins matching polylang (status + version) ==="
    curl -s -u "$AUTH" "$BASE/wp-json/wp/v2/plugins?context=edit" | python3 -c "
    import sys, json
    try:
        d = json.load(sys.stdin)
    except Exception as e:
        print('plugins endpoint: could not parse JSON:', e); sys.exit(0)
    if isinstance(d, dict) and d.get('code'):
        print('plugins endpoint error:', json.dumps(d, indent=2)); sys.exit(0)
    hits = [p for p in d if 'polylang' in p.get('plugin','').lower() or 'polylang' in p.get('name','').lower()]
    if not hits:
        print('NO polylang plugin found among', len(d), 'installed plugins')
        print('all installed plugins:')
        for p in d: print(' -', p.get('plugin'), '| status:', p.get('status'), '| version:', p.get('version'))
    for p in hits:
        print(json.dumps({k: p.get(k) for k in ('plugin','name','status','version','requires_wp','requires_php')}, indent=2))
    "

    echo "=== [$ENV_LABEL] 3. pll/v1 namespace routes ==="
    curl -s -u "$AUTH" "$BASE/wp-json/pll/v1" | python3 -c "
    import sys, json
    try:
        d = json.load(sys.stdin)
    except Exception as e:
        print('pll/v1: could not parse JSON:', e); sys.exit(0)
    if isinstance(d, dict) and d.get('code'):
        print('pll/v1 error:', json.dumps({k: d.get(k) for k in ('code','message')}, indent=2))
    else:
        print(json.dumps(sorted((d.get('routes') or {}).keys()), indent=2))
    "

    echo "=== [$ENV_LABEL] 4. Configured languages (pll/v1/languages) ==="
    curl -s -u "$AUTH" "$BASE/wp-json/pll/v1/languages" | python3 -m json.tool || true

    echo "=== [$ENV_LABEL] 5. Polylang settings (pll/v1/settings) ==="
    curl -s -u "$AUTH" "$BASE/wp-json/pll/v1/settings" | python3 -m json.tool || true

    echo "=== [$ENV_LABEL] 6. Core settings (site language etc) ==="
    curl -s -u "$AUTH" "$BASE/wp-json/wp/v2/settings" | python3 -c "
    import sys, json
    try:
        d = json.load(sys.stdin)
    except Exception as e:
        print('settings: could not parse JSON:', e); sys.exit(0)
    keys = ('title','language','timezone','page_on_front','page_for_posts','show_on_front','permalink_structure')
    print(json.dumps({k: d.get(k) for k in keys if isinstance(d, dict)}, indent=2))
    "

    echo "=== [$ENV_LABEL] 7. Menu locations (Polylang duplicates these per language) ==="
    curl -s -u "$AUTH" "$BASE/wp-json/wp/v2/menu-locations?context=edit" | python3 -m json.tool || true

    echo "=== [$ENV_LABEL] 8. Homepage hreflang / language-switcher markup (front-end, unauthenticated) ==="
    curl -s -L "$BASE/" | grep -oiE '<link[^>]*hreflang[^>]*>|lang-item[^" ]*|pll_switcher' | sort -u | head -40 || echo "no hreflang/switcher markup found on homepage"

    echo "=== [$ENV_LABEL] 9. Language taxonomy REST presence (wp/v2 types with lang support probe) ==="
    curl -s -u "$AUTH" "$BASE/wp-json/wp/v2/pages?per_page=1&context=edit" | python3 -c "
    import sys, json
    try:
        d = json.load(sys.stdin)
    except Exception as e:
        print('pages probe: could not parse JSON:', e); sys.exit(0)
    if isinstance(d, list) and d:
        p = d[0]
        lang_keys = [k for k in p.keys() if 'lang' in k.lower() or 'translation' in k.lower()]
        print('page id', p.get('id'), 'exposes language-related REST fields:', lang_keys or 'NONE')
    else:
        print('unexpected pages response:', str(d)[:300])
    "
