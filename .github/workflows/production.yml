name: Deploy Theme to Production

# Auto-deploys the Molosoc standalone theme to production on every push to
# `main`. Only syncs site/theme/ — never the whole WordPress install, so
# uploads, order data, and plugin files on the server are untouched.

on:
  push:
    branches: [main]
    paths:
      - "site/theme/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PROD_SFTP_HOST }}
          username: ${{ secrets.PROD_SFTP_USER }}
          password: ${{ secrets.PROD_SFTP_PASS }}
          protocol: ftps
          local-dir: site/theme/
          server-dir: /wp-content/themes/molosoc/
          # First three are the action's defaults (setting exclude replaces
          # them). preview/** are local design previews - dev artifacts that
          # were publicly reachable, indexable near-duplicates of real pages
          # on production (SEO remediation step 3B removed them server-side).
          exclude: |
            .git*
            .git*/**
            **/node_modules/**
            preview/**

  # Issue #205: after PR #204 deployed, WP-Optimize kept serving pre-deploy
  # page HTML (and the minified CSS bundle it references) to logged-out
  # users until a manual purge. This job removes WP-Optimize's page-cache
  # directory so the next anonymous request re-renders against the new theme.
  #
  # Safety properties (asserted by tests/test_post_deploy_cache_purge_205.py):
  #   - runs only when the deploy job succeeded (needs + success());
  #   - reuses the deploy's existing PROD_SFTP_* secrets - no new credential,
  #     no WP admin/REST call, no SSH;
  #   - deletes ONE exact path (/wp-content/cache/wpo-cache), a pure cache
  #     directory WP-Optimize recreates on demand; never a wildcard, never
  #     uploads, orders, products or WooCommerce settings;
  #   - idempotent: an already-absent directory is a pass;
  #   - failure-visible: any FTPS error (connect, auth, listing or delete)
  #     fails the job (red run) instead of being swallowed. The directory
  #     reappearing after the delete is NOT a failure (WP-Optimize recreates
  #     it on the next anonymous request).
  # WP-Optimize does not cache cart/checkout/account pages, and this job does
  # not change that policy. The minify directory is deliberately left alone:
  # fresh page HTML references the current bundle, and deleting it risks
  # broken CSS until it regenerates.
  purge-page-cache:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Purge WP-Optimize page cache (production)
        env:
          HOST: ${{ secrets.PROD_SFTP_HOST }}
          USER: ${{ secrets.PROD_SFTP_USER }}
          PASS: ${{ secrets.PROD_SFTP_PASS }}
        run: |
          set -eu
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::PROD_SFTP_* secrets missing - page cache NOT purged"
            exit 1
          fi
          CACHE_DIR=/wp-content/cache/wpo-cache
          # TLS certificate verification stays on (lftp default).
          LFTP="set ftp:ssl-force true; set net:max-retries 3; set net:timeout 30;"
          # Hard failure on connection/auth errors (no '|| true').
          lftp -u "$USER,$PASS" -e "$LFTP cls -1 /wp-content/cache; bye" "$HOST" > /tmp/before.txt
          cat /tmp/before.txt
          if grep -qx "wpo-cache/\?" /tmp/before.txt; then
            lftp -u "$USER,$PASS" -e "$LFTP rm -rf $CACHE_DIR; bye" "$HOST"
          else
            echo "$CACHE_DIR already absent - nothing to purge"
          fi
          lftp -u "$USER,$PASS" -e "$LFTP cls -1 /wp-content/cache; bye" "$HOST" > /tmp/after.txt
          cat /tmp/after.txt
          # WP-Optimize recreates the directory on the next anonymous request,
          # so its presence here is not a failure: the delete command above
          # already hard-fails on FTPS errors, and the re-listing succeeding
          # confirms the connection is healthy.
          if grep -qx "wpo-cache/\?" /tmp/after.txt; then
            echo "$CACHE_DIR recreated by a fresh request after the purge - not an error"
          fi
          echo "WP-Optimize page cache purged"
