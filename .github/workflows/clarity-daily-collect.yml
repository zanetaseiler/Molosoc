name: Clarity Daily Collection (single authoritative snapshot)

# Recurring collection for the existing Phase 1 collector
# (clarity_daily_collect.py), plus manual dispatch for a missed day.
#
# This workflow collects Clarity history and nothing else. It generates no
# report, runs no analysis, and writes nothing back to Clarity, GA4, Search
# Console, WordPress, or the site.
#
# Makes exactly ONE live Clarity API call per run: numOfDays=1 is a hardcoded
# constant in clarity_daily_collect.py, not a flag, and the script reserves 1
# call from the persisted daily budget ledger (cap 3 of Clarity's 10) before
# calling. Duplicate protection is built into the collector itself — a second
# run on a UTC date already collected is skipped before a call is spent and
# never overwritten, unless --force is passed, which this workflow deliberately
# never does.
#
# WHY 02:20 UTC
#
# Clarity's numOfDays=1 is a trailing 24-hour window from the moment of the
# call, not a calendar day, so the collection time defines the bucket boundary.
# Three things drove the choice:
#
#   1. Quiet edges. 02:20 UTC is 03:20 (CET) / 04:20 (CEST) local. Traffic is
#      Czech — every session in the verified run came from the Czech Republic —
#      so both edges of the window fall in the lowest-traffic hours and a real
#      browsing session is very unlikely to be split across two daily buckets.
#   2. Slack after the date rollover. GitHub's scheduled runs are best-effort
#      and can be delayed by tens of minutes under load. 2h20m past 00:00 UTC
#      means a late run still records on the UTC date it was meant for. A time
#      near midnight could slip across the boundary and skip a date entirely —
#      and a skipped Clarity day cannot be backfilled.
#   3. Off the hour. Scheduled workflows cluster at :00 and queue behind each
#      other; an odd minute measurably reduces the delay.
#
# The UTC time is fixed, so the local time shifts by an hour across DST. That
# is intentional: the window stays exactly 24 hours and non-overlapping, which
# is what the data model requires. A fixed local time would produce a 23- or
# 25-hour window twice a year.
#
# NOTE: GitHub only runs `schedule` triggers for workflows on the DEFAULT
# branch. Until this branch is merged to main, the cron will not fire and only
# workflow_dispatch works.

on:
  schedule:
    # 02:20 UTC daily — see the rationale above.
    - cron: "20 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Two overlapping runs could both pass the already-collected check before
# either writes, producing two snapshots for one UTC date. Queue instead of
# cancelling: a cancelled run mid-write is worse than a late one.
concurrency:
  group: clarity-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automations/analytics/requirements.txt

      - name: Check required secrets/variables are present
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: |
          missing=0
          [ -z "$CLARITY_API_TOKEN" ] && echo "Missing CLARITY_API_TOKEN" && missing=1
          [ -z "$ANALYTICS_STORAGE_SA_JSON" ] && echo "Missing ANALYTICS_STORAGE_SA_JSON" && missing=1
          [ -z "$ANALYTICS_BUCKET" ] && echo "Missing ANALYTICS_BUCKET" && missing=1
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "All required secrets/variables present (values never printed)."

      - name: Report budget/coverage status (no API call)
        env:
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: python3 automations/analytics/clarity_daily_collect.py --status

      - name: Collect one Clarity daily snapshot (numOfDays=1, single API call, no --force)
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: python3 automations/analytics/clarity_daily_collect.py

      - name: Verify the written objects can be read back from GCS
        env:
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import sys
          sys.path.insert(0, "automations/analytics")
          from storage import raw_prefix, facts_key
          from storage_gcs import store_from_env
          from records import CLARITY

          store = store_from_env()
          date = dt.datetime.now(dt.timezone.utc).date().isoformat()

          prefix = raw_prefix(CLARITY, date)
          raw_keys = store.list_keys(prefix)
          print(f"raw objects under {prefix}: {raw_keys}")
          assert raw_keys, f"no raw snapshot found for {date}"
          for k in raw_keys:
              body = store.get_json(k)
              print(f"  READ OK: {k} (top-level keys: {sorted(body.keys())})")

          fk = facts_key(CLARITY, date)
          facts = store.get_json(fk)
          print(f"READ OK: {fk} -> {len(facts.get('records', []))} normalized record(s)")

          qk = f"facts/{CLARITY}/{date}.quality.json"
          quality = store.get_json(qk)
          print(f"READ OK: {qk} -> {len(quality.get('flags', []))} flag(s), "
                f"{len(quality.get('excluded_records', []))} excluded record(s)")

          print("\nAll written objects for today's snapshot were read back successfully.")
          PY
