name: Clarity Daily Collection (manual, single authoritative snapshot)

# One-off manual run of the existing Phase 1 collector (clarity_daily_collect.py).
# workflow_dispatch ONLY: no push trigger, no schedule/cron — this does not
# start recurring collection, that stays a separate, later decision.
#
# Makes exactly ONE live Clarity API call: numOfDays=1 is a hardcoded constant
# in clarity_daily_collect.py, not a flag, and the script reserves 1 call from
# the persisted daily budget ledger before calling. Duplicate protection is
# built into the collector itself — a second run on a UTC date already
# collected is skipped, never overwritten, unless --force is passed, which
# this workflow deliberately never does.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automations/analytics/requirements.txt

      - name: Check required secrets/variables are present
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: |
          missing=0
          [ -z "$CLARITY_API_TOKEN" ] && echo "Missing CLARITY_API_TOKEN" && missing=1
          [ -z "$ANALYTICS_STORAGE_SA_JSON" ] && echo "Missing ANALYTICS_STORAGE_SA_JSON" && missing=1
          [ -z "$ANALYTICS_BUCKET" ] && echo "Missing ANALYTICS_BUCKET" && missing=1
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "All required secrets/variables present (values never printed)."

      - name: Report budget/coverage status (no API call)
        env:
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: python3 automations/analytics/clarity_daily_collect.py --status

      - name: Collect one Clarity daily snapshot (numOfDays=1, single API call, no --force)
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: python3 automations/analytics/clarity_daily_collect.py

      - name: Verify the written objects can be read back from GCS
        env:
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import sys
          sys.path.insert(0, "automations/analytics")
          from storage import raw_prefix, facts_key
          from storage_gcs import store_from_env
          from records import CLARITY

          store = store_from_env()
          date = dt.datetime.now(dt.timezone.utc).date().isoformat()

          prefix = raw_prefix(CLARITY, date)
          raw_keys = store.list_keys(prefix)
          print(f"raw objects under {prefix}: {raw_keys}")
          assert raw_keys, f"no raw snapshot found for {date}"
          for k in raw_keys:
              body = store.get_json(k)
              print(f"  READ OK: {k} (top-level keys: {sorted(body.keys())})")

          fk = facts_key(CLARITY, date)
          facts = store.get_json(fk)
          print(f"READ OK: {fk} -> {len(facts.get('records', []))} normalized record(s)")

          qk = f"facts/{CLARITY}/{date}.quality.json"
          quality = store.get_json(qk)
          print(f"READ OK: {qk} -> {len(quality.get('flags', []))} flag(s), "
                f"{len(quality.get('excluded_records', []))} excluded record(s)")

          print("\nAll written objects for today's snapshot were read back successfully.")
          PY
