name: Sync Media Library CSV

# Manual, on-demand refresh of media-library.csv from the live WP media
# library (read-only against WordPress — automations/content-sync/list_media.py
# never writes anything back). Uses the same staging secrets as
# content-sync.yml so no credential ever needs to leave GitHub.

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch media library
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 automations/content-sync/list_media.py media-library.csv

      - name: Commit updated CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- media-library.csv; then
            git add media-library.csv
            git commit -m "Sync media-library.csv from WordPress media library"
            git push origin staging
          else
            echo "No changes to media-library.csv"
          fi
