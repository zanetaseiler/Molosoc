name: Weekly Marketing Analysis Report

# Generates one Markdown marketing analysis report per week and uploads it as a
# GitHub Actions artifact. Nothing is delivered anywhere else: no email, no
# Slack, no dashboard, and nothing is committed back to the repository.
#
# Read-only against every source. GA4 and Search Console are hydrated for the
# two compared windows; Clarity is read only from the durable GCS ledger.
#
# ZERO CLARITY API CALLS. The daily collector owns Clarity's 10-calls-per-day
# budget, and a day of Clarity history that is missed cannot be backfilled — so
# a report that spent from that budget could permanently cost real data. The
# analysis reads Clarity from storage only, and a test asserts it.
#
# WHY WEDNESDAY 06:15 UTC
#
#   1. Search Console finalises on a ~3-day lag, so the analysis anchor is
#      today - 3. Running on a Wednesday makes that anchor a Sunday, which
#      means the analysed period is the previous Monday-to-Sunday week and the
#      comparison is the Monday-to-Sunday week before it. Whole calendar weeks
#      compare like with like; a mid-week boundary would split weekend traffic
#      across both windows.
#   2. 06:15 UTC is roughly four hours after the daily Clarity collector at
#      02:20 UTC, so the ledger is settled and the two jobs never contend.
#   3. Off the hour, because scheduled workflows cluster at :00 and queue.
#   4. 07:15/08:15 in Prague, so the report is ready at the start of the day.
#
# The UTC time is fixed, so local time shifts by an hour across DST. That is
# intentional — the analysis windows are whole UTC days either way.
#
# NOTE: GitHub only fires `schedule` for workflows on the DEFAULT branch. Until
# this is merged to main the cron will not run; workflow_dispatch still works.

on:
  schedule:
    # 06:15 UTC every Wednesday — see the rationale above.
    - cron: "15 6 * * 3"
  workflow_dispatch:
    inputs:
      today:
        description: "Override today's date (YYYY-MM-DD) to re-run a past week"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-marketing-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automations/analytics/requirements.txt pytest

      - name: Run offline unit tests
        run: python3 -m pytest automations/analytics/ -q

      - name: Check required secrets/variables are present
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: |
          missing=0
          [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON" && missing=1
          [ -z "$ANALYTICS_STORAGE_SA_JSON" ] && echo "Missing ANALYTICS_STORAGE_SA_JSON" && missing=1
          [ -z "$ANALYTICS_BUCKET" ] && echo "Missing ANALYTICS_BUCKET" && missing=1
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "All required secrets/variables present (values never printed)."

      # --persist additionally stores the report in the analytics bucket under
      # reports/weekly/, which is where a future strategy agent or dashboard
      # reads it from. The GitHub artifact below is unchanged and remains the
      # human download path; the two are independent, and the upload steps run
      # with if: always() so a storage problem can never cost the artifact.
      # ---------------------------------------------------------------------
      # The Email Marketing card's evidence.
      #
      # A SECOND producer publishes it — the email orchestrator in the client's
      # private repository — into this same bucket under its own feed. Two
      # reads, no listing: the pointer, and the one document it names, whose
      # key is validated against the email prefix before it is requested
      # because it arrived inside a document.
      #
      # `continue-on-error`: a missing or unreadable email document costs the
      # Email card and nothing else. A weekly report that failed because a
      # second channel was quiet would be a worse report than one whose Email
      # card says the channel is not yet publishing evidence.
      # ---------------------------------------------------------------------
      - name: Fetch the published email evidence (optional)
        id: email
        continue-on-error: true
        env:
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, "automations/analytics")
          import email_summary as es
          import storage_gcs

          out = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "email.json")
          try:
              store = storage_gcs.store_from_env()
              document = es.fetch(store)
          except es.PointerRefused as exc:
              # A pointer naming an object outside the email feed is a security
              # event, not a missing-data condition. It is reported loudly and
              # the card is left empty.
              print(f"::error::{exc}")
              raise SystemExit(1)
          except Exception as exc:                       # noqa: BLE001
              print(f"::warning::email evidence could not be read: "
                    f"{type(exc).__name__}")
              raise SystemExit(1)

          if not document:
              print("::warning::no email evidence has been published yet; the "
                    "Email card will say so")
              raise SystemExit(1)

          with open(out, "w", encoding="utf-8") as handle:
              json.dump(document, handle, ensure_ascii=False)
          period = document.get("period", {})
          print(f"email evidence: {period.get('start')} to {period.get('end')}")
          PY

      - name: Generate the weekly report and persist it durably
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANALYTICS_STORAGE_SA_JSON: ${{ secrets.ANALYTICS_STORAGE_SA_JSON }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
          GA4_PROPERTY_ID: "521643495"
          GSC_SITE_URL: "sc-domain:molosoc.com"
          # Committed default is 2026-08-16; the variable overrides it if set.
          ECOMMERCE_TRACKING_START: ${{ vars.ECOMMERCE_TRACKING_START }}
          REPORT_TODAY: ${{ inputs.today }}
        run: |
          # Exit codes: 0 ok, 1 generation/storage failure, 2 reports stored but
          # the latest/index pointer could not be updated, 3 this week is
          # already published and was not overwritten.
          set +e
          EMAIL_ARG=""
          if [ -s "$RUNNER_TEMP/email.json" ]; then
            EMAIL_ARG="--email-evidence $RUNNER_TEMP/email.json"
          fi

          if [ -n "$REPORT_TODAY" ]; then
            python3 automations/analytics/weekly_report.py \
              --out-dir reports --also-json --persist \
              --dashboard-out site/index.html --today "$REPORT_TODAY" $EMAIL_ARG
          else
            python3 automations/analytics/weekly_report.py \
              --out-dir reports --also-json --persist \
              --dashboard-out site/index.html $EMAIL_ARG
          fi
          code=$?
          set -e

          # 3 means the authoritative record for this week already exists and
          # was protected — which is the storage layer succeeding, not failing.
          # The report and the dashboard were both still produced, and there is
          # no reason to withhold the page because the history was already
          # written. Anything else is a real failure and stops the run.
          if [ "$code" = "3" ]; then
            echo "::warning::This week is already published; the stored report was left untouched. Continuing to publish the dashboard."
            exit 0
          fi
          exit "$code"

      - name: Confirm nothing was committed back to the repository
        if: always()
        run: |
          # The report is an artifact, never a commit. A dirty tree here would
          # mean generated output landed in the working copy.
          if [ -n "$(git status --porcelain -- . ':!reports' ':!site/index.html')" ]; then
            echo "::error::Repository working tree is dirty outside reports/ — the report run must not modify tracked files."
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean; report exists only as a build output."

      # 90 days, unchanged. GCS is the durable machine-readable record; this
      # stays the convenient human download.
      - name: Upload the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molosoc-marketing-analysis
          path: reports/
          retention-days: 90
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Publish the HTML view to the Trafficdom report host over SFTP.
      #
      # Last, and deliberately so: GCS persistence and the GitHub artifact are
      # already done by this point, so a problem with the report host cannot
      # cost either of them.
      #
      # SFTP rather than FTPS. The shared host presents its provider's internal
      # certificate for *.prod.phx3.secureserver.net, which no hostname we
      # control can verify against — so the transport was replaced rather than
      # its verification switched off. SSH authenticates by host key, which the
      # publisher prints on every run so it can be pinned via REPORTS_SSH_HOST_KEY.
      #
      # The destination is derived in code as ${REPORTS_BASE_PATH}/molosoc and
      # cannot be redirected from here. The dry run prints the resolved path
      # without connecting; the uploader then re-checks the server's own working
      # directory and abandons the upload unless it matches. That host also
      # serves a live WordPress site, which is why the check is doubled.
      #
      # One file, index.html. Nothing is deleted, renamed or moved.
      # ---------------------------------------------------------------------
      - name: Verify the resolved remote path (no connection)
        env:
          REPORTS_SSH_USER: ${{ secrets.REPORTS_SSH_USER }}
          REPORTS_SFTP_USER: ${{ secrets.REPORTS_SFTP_USER }}
          REPORTS_SSH_KEY: ${{ secrets.REPORTS_SSH_KEY }}
          REPORTS_BASE_PATH: ${{ vars.REPORTS_BASE_PATH }}
        run: python3 automations/analytics/publish_dashboard.py --dry-run

      - name: Publish the dashboard over SFTP
        env:
          REPORTS_SSH_HOST: ${{ secrets.REPORTS_SSH_HOST }}
          REPORTS_SSH_USER: ${{ secrets.REPORTS_SSH_USER }}
          REPORTS_SFTP_USER: ${{ secrets.REPORTS_SFTP_USER }}
          REPORTS_SSH_KEY: ${{ secrets.REPORTS_SSH_KEY }}
          REPORTS_SSH_HOST_KEY: ${{ secrets.REPORTS_SSH_HOST_KEY }}
          REPORTS_BASE_PATH: ${{ vars.REPORTS_BASE_PATH }}
        run: python3 automations/analytics/publish_dashboard.py --file site/index.html

      - name: Verify the page is live
        run: |
          url="https://trafficdom.com/reports/molosoc/"
          code=$(curl -sS -L --max-time 30 -o /tmp/live.html -w "%{http_code}" "$url" || echo 000)
          echo "HTTP $code from $url"
          if [ "$code" != "200" ]; then
            echo "::error::$url returned HTTP $code"
            exit 1
          fi
          # Case-insensitive: the page's own title is "Weekly Marketing
          # Analysis" in title case since the TrafficDom redesign. The check is
          # unchanged in what it verifies — that the live page is this report.
          if ! grep -qi "weekly marketing analysis" /tmp/live.html; then
            echo "::error::$url served a page, but not the dashboard"
            head -c 400 /tmp/live.html
            exit 1
          fi
          echo "PASS the dashboard is live at $url ($(wc -c < /tmp/live.html) bytes)"
