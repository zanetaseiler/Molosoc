name: Verify coupon VITEJ10 (read-only)

# TEMPORARY, READ-ONLY. Answers one question: how is the WooCommerce coupon
# VITEJ10 configured, and could a customer redeem it?
#
# The MOLOSOC welcome email offers VITEJ10 as a code the recipient types in at
# checkout. Nothing had ever confirmed that coupon exists in WooCommerce, so the
# email library carries it as an unverified assumption. This resolves that.
#
# Exactly one authenticated request, and it is a GET:
#
#     GET /wp-json/wc/v3/coupons?code=vitej10
#
# No POST, PUT, PATCH or DELETE. It does not create, edit, enable, disable or
# delete a coupon, does not place an order, and does not touch WooCommerce,
# WordPress, Brevo, templates, products or settings. Credentials are passed to
# curl through the environment and never printed; the site host is a secret and
# is kept out of the log, so only the request path is echoed.
#
# Delete this workflow once the coupon configuration is recorded.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: GET the VITEJ10 coupon record
        env:
          WP_URL: ${{ secrets.PROD_WP_URL }}
          WP_USER: ${{ secrets.PROD_WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.PROD_WP_APP_PASSWORD }}
        run: |
          set -uo pipefail   # deliberately no -x: it would echo the credentials

          echo "Request: GET <site>/wp-json/wc/v3/coupons?code=vitej10"
          echo ""

          status=$(curl -s -o /tmp/coupon.json -w '%{http_code}' \
            --max-time 60 \
            -u "$WP_USER:$WP_APP_PASSWORD" \
            -H "Accept: application/json" \
            "${WP_URL%/}/wp-json/wc/v3/coupons?code=vitej10")

          echo "HTTP status: $status"
          echo ""

          if [ "$status" != "200" ]; then
            echo "::error::STOPPED — the API did not return 200."
            echo "--- response body ---"
            # Body of an auth/permission error names the WooCommerce error code
            # and carries no credential material.
            head -c 2000 /tmp/coupon.json
            echo ""
            echo ""
            case "$status" in
              401) echo "401: the application password was rejected." ;;
              403) echo "403: authenticated, but this user lacks the WooCommerce"
                   echo "     capability to read coupons (needs manage_woocommerce)."
                   echo "     May also be bot protection — check for 'imunify' above." ;;
              404) echo "404: the wc/v3 route is absent. WooCommerce REST API not"
                   echo "     available at this path." ;;
            esac
            echo "No further requests made."
            exit 1
          fi

          echo "--- parsed coupon record ---"
          python3 - <<'PY'
          import json

          with open("/tmp/coupon.json") as fh:
              data = json.load(fh)

          if not isinstance(data, list):
              print("Unexpected response shape:", type(data).__name__)
              print(json.dumps(data, indent=2)[:2000])
              raise SystemExit(1)

          if not data:
              print("coupon exists: NO")
              print("")
              print("The query returned an empty list. No coupon with the code")
              print("'vitej10' exists in this WooCommerce store.")
              raise SystemExit(0)

          if len(data) > 1:
              print("NOTE: %d coupons matched. Listing each." % len(data))
              print("")

          FIELDS = [
              "id", "code", "status", "discount_type", "amount",
              "date_expires", "minimum_amount", "maximum_amount",
              "product_ids", "excluded_product_ids",
              "product_categories", "excluded_product_categories",
              "usage_limit", "usage_limit_per_user", "usage_count",
              "individual_use", "exclude_sale_items", "free_shipping",
              "email_restrictions", "limit_usage_to_x_items",
              "date_created", "date_modified",
          ]

          for c in data:
              print("coupon exists: YES")
              print("")
              for f in FIELDS:
                  print("%-30s %s" % (f + ":", json.dumps(c.get(f))))
              print("")
              # Redemption reasoning, from the coupon record alone.
              print("--- redeemability signals ---")
              limit = c.get("usage_limit")
              used = c.get("usage_count")
              if limit is not None and used is not None and used >= limit:
                  print("EXHAUSTED: usage_count (%s) has reached usage_limit (%s)."
                        % (used, limit))
              elif limit is None:
                  print("Usage limit: none — total redemptions are unlimited.")
              else:
                  print("Usage remaining: %s of %s." % (limit - used, limit))

              if c.get("status") != "publish":
                  print("NOT LIVE: status is '%s', not 'publish'." % c.get("status"))

              if c.get("date_expires"):
                  print("Expires: %s (compare against today)." % c.get("date_expires"))
              else:
                  print("Expiry: none set.")

              scoped = any(c.get(k) for k in
                           ("product_ids", "product_categories"))
              if scoped:
                  print("SCOPED: restricted to specific products/categories above.")
              else:
                  print("Scope: no product or category include-list — applies store-wide,")
                  print("       minus any exclusions listed above.")

              if c.get("exclude_sale_items"):
                  print("NOTE: exclude_sale_items is true — will not apply to items")
                  print("      currently on sale.")

              if c.get("email_restrictions"):
                  print("NOTE: restricted to specific billing emails.")
              print("")
          PY

          echo "Done. One GET performed; nothing was created, modified or deleted."
