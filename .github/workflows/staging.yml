name: Deploy Theme to Staging

# Auto-deploys the WP child theme to staging on every push to `staging`.
# Only syncs site/theme/ — never the whole WordPress install, so uploads,
# order data, and plugin files on the server are untouched.

on:
  push:
    branches: [staging]
    paths:
      - "site/theme/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG real FTP directory listing (read-only)
        env:
          FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
          FTP_USER: ${{ secrets.STAGING_SFTP_USER }}
          FTP_PASS: ${{ secrets.STAGING_SFTP_PASS }}
        run: |
          for path in "/" "/public_html/" "/public_html/staging.molosoc.com/" "/staging.molosoc.com/" "/domains/" "/www/"; do
            echo "=== $path ==="
            curl -s -k --ftp-ssl --list-only "ftp://${FTP_HOST}${path}" -u "${FTP_USER}:${FTP_PASS}" || echo "(failed/does not exist)"
            echo
          done
