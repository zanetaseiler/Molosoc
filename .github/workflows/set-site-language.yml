name: Set Site Language

# One-off/reusable manual workflow: sets Settings -> General -> Site
# Language in wp-admin via the REST API, so this doesn't require a human
# to click through the dashboard by hand. Same repo secrets (WP_URL/
# WP_USER/WP_APP_PASSWORD) as every other content-sync workflow.
#
# Run from the Actions tab -> "Set Site Language" -> Run workflow,
# fill in the locale (default: "en" for English (United States)).

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'WP locale code (e.g. cs_CZ), or "en" for English (United States)'
        required: true
        default: "en"
  # TEMPORARY — workflow_dispatch can't be invoked via `gh workflow run` until
  # this file exists on the repo's default branch, and this repo's default
  # branch (main) intentionally has no direct-push path from automation.
  # This push trigger runs the one-off English switch once, then gets
  # removed in a follow-up commit — see the commit that adds this block.
  push:
    branches: [staging]
    paths:
      - ".github/workflows/set-site-language.yml"

jobs:
  set-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Set site language
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python3 automations/content-sync/set_site_language.py --language "${{ inputs.language || 'en' }}"
