name: Codex feedback to Claude

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-feedback-${{ github.event.pull_request.number }}-${{ github.event.review.id }}
  cancel-in-progress: false

jobs:
  requeue-claude:
    if: github.event.review.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate current-head Codex findings
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail

          current_head="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ ! "${current_head}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve current PR head" >&2
            exit 1
          fi

          if [[ "${REVIEW_COMMIT}" != "${current_head}" ]]; then
            echo "Ignoring stale Codex review ${REVIEW_ID}: ${REVIEW_COMMIT} != ${current_head}"
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          findings="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments" --jq 'length')"
          if [[ "${findings}" -eq 0 ]]; then
            echo "Codex review has no inline findings; no Claude correction needed."
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Validated ${findings} Codex finding(s) on current head ${current_head}."
          echo "has_findings=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=${current_head}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted default-branch bridge
        if: steps.validate.outputs.has_findings == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Queue Claude correction
        if: steps.validate.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            -f 'labels[]=READY_FOR_CLAUDE_CLOUD' >/dev/null

      - name: Fire Claude correction directly
        if: steps.validate.outputs.has_findings == 'true'
        env:
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/claude_cloud_bridge.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"
